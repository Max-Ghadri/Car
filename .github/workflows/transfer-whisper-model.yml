name: transfer-whisper-model

on:
  push:
  workflow_dispatch:

jobs:
  download-and-package:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Download Silero VAD model for whisper.cpp
        shell: bash
        run: |
          set -euo pipefail
          curl -L --fail --retry 5 --retry-delay 2 \
            -o ggml-silero-v6.2.0.bin \
            'https://huggingface.co/ggml-org/whisper-vad/resolve/main/ggml-silero-v6.2.0.bin?download=true'
          sha256sum ggml-silero-v6.2.0.bin > vad.sha256
          ls -lh ggml-silero-v6.2.0.bin vad.sha256
      - name: Upload VAD model
        uses: actions/upload-artifact@v4
        with:
          name: whisper-silero-vad-v6.2.0
          path: |
            ggml-silero-v6.2.0.bin
            vad.sha256
          retention-days: 1
