name: transfer-whisper-model

on:
  push:
  workflow_dispatch:

jobs:
  download-and-package:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Download and split Whisper Large v3 Turbo Q5 model
        shell: bash
        run: |
          set -euo pipefail
          curl -L --fail --retry 5 --retry-delay 2 \
            -o ggml-large-v3-turbo-q5_0.bin \
            'https://huggingface.co/ggerganov/whisper.cpp/resolve/main/ggml-large-v3-turbo-q5_0.bin?download=true'
          sha256sum ggml-large-v3-turbo-q5_0.bin > model.sha256
          split -b 287000000 -d -a 2 ggml-large-v3-turbo-q5_0.bin model-part-
          ls -lh model-part-* model.sha256
      - name: Upload model part 02
        uses: actions/upload-artifact@v4
        with:
          name: whisper-model-part-02
          path: model-part-02
          compression-level: 0
          retention-days: 1
