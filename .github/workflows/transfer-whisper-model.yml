name: transfer-whisper-model

on:
  push:
  workflow_dispatch:

jobs:
  download-and-package:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Download Whisper Small Q5 multilingual model
        shell: bash
        run: |
          set -euo pipefail
          curl -L --fail --retry 5 --retry-delay 2 \
            -o ggml-small-q5_1.bin \
            'https://huggingface.co/ggerganov/whisper.cpp/resolve/main/ggml-small-q5_1.bin?download=true'
          sha256sum ggml-small-q5_1.bin > small.sha256
          ls -lh ggml-small-q5_1.bin small.sha256
      - name: Upload model
        uses: actions/upload-artifact@v4
        with:
          name: whisper-small-q5_1
          path: |
            ggml-small-q5_1.bin
            small.sha256
          compression-level: 0
          retention-days: 1
