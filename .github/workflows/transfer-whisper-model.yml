name: transfer-whisper-model

on:
  push:
  workflow_dispatch:

jobs:
  download-and-package:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Download Whisper Large v3 Turbo Q5 model
        shell: bash
        run: |
          set -euo pipefail
          curl -L --fail --retry 5 --retry-delay 2 \
            -o ggml-large-v3-turbo-q5_0.bin \
            'https://huggingface.co/ggerganov/whisper.cpp/resolve/main/ggml-large-v3-turbo-q5_0.bin?download=true'
          ls -lh ggml-large-v3-turbo-q5_0.bin
          sha256sum ggml-large-v3-turbo-q5_0.bin
      - name: Upload model as Actions artifact
        uses: actions/upload-artifact@v4
        with:
          name: whisper-model-large-v3-turbo-q5_0
          path: ggml-large-v3-turbo-q5_0.bin
          compression-level: 0
          retention-days: 1
